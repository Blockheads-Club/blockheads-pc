[package]
name = "bhpc-mods"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Client mod loader of Blockheads PC: the 0xBC join flow (HELLO, mod list, downloads, READY), the mod host session (Luau + WASM through bhmod-core), and the in-game mod UI drawn as an overlay."

[features]
# JVM client mods (Java, Kotlin, ...): bhmod-core's JNI runtime on the user's JRE, loaded at run time. Off by default;
# building with it needs a JDK (the Java SDK is compiled in).
jvm = ["bhmod-core/jvm"]

[dependencies]
bhpc-launcher = { path = "../bhpc-launcher" }
bhpc-input = { path = "../bhpc-input" }
bhmod-core.workspace = true
bhmod-wasm.workspace = true
bhmod-proto.workspace = true
bhmod-content.workspace = true
bhmod-client.workspace = true
bhmod-manifest.workspace = true
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
ab_glyph = "0.2"

[dev-dependencies]
tempfile = "3"
sha2 = "0.10"
zip = { version = "2.4", default-features = false, features = ["deflate"] }
