[package]
name = "bhpc-launcher"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Launcher for the PC port: APK picker, data dir, key bindings, window options, Android save import, LaunchConfig."

[dependencies]
bhpc-loader.workspace = true
bhpc-vfs.workspace = true
bhpc-input = { path = "../bhpc-input" }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
zip = { version = "2.4", default-features = false, features = ["deflate"] }
dirs = "6"
eframe = { version = "0.29", optional = true, default-features = false, features = ["glow", "default_fonts", "x11", "wayland"] }

[dev-dependencies]
tempfile = "3"

[features]
# The egui front end. Off by default so the library (all the logic) builds and is measured without a GUI stack.
gui = ["dep:eframe"]

[[bin]]
name = "bhpc-launcher"
path = "src/main.rs"
required-features = ["gui"]
