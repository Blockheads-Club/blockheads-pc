[package]
name = "bhpc-launcher"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Logic behind the Blockheads PC launcher (app/): APK check, key bindings, window options, LaunchConfig, save import, game process supervision."

[dependencies]
bhpc-loader.workspace = true
bhpc-vfs.workspace = true
bhpc-input = { path = "../bhpc-input" }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
zip = { version = "2.4", default-features = false, features = ["deflate"] }
dirs = "6"

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[dev-dependencies]
tempfile = "3"
