[package]
name = "bhpc-launcher"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Logic behind the Blockheads PC launcher (app/): APK check, key bindings, window options, LaunchConfig, save import, game process supervision, client mods."

[dependencies]
bhpc-loader.workspace = true
bhpc-vfs.workspace = true
bhpc-input = { path = "../bhpc-input" }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
zip = { version = "2.4", default-features = false, features = ["deflate"] }
dirs = "6"
# Mods: mod.toml and .bhmod package checks, the same rules as `bhmod check` and the mod hosts (mod-sdk, pinned in
# the workspace).
bhmod-manifest.workspace = true
semver = "1"
serde_json = "1"

[target.'cfg(unix)'.dependencies]
libc.workspace = true

# Shared read-only mapping of the frame file (embed.rs).
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Memory"] }

[dev-dependencies]
tempfile = "3"
