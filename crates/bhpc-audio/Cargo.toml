[package]
name = "bhpc-audio"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Audio for the Blockheads PC port: a PCM mixer, an OpenSL ES HLE for the guest and an AudioTrack model, independent of any audio device."

[dependencies]
bhpc-mem.workspace = true
bhpc-cpu.workspace = true
symphonia = { version = "0.6.1", default-features = false, features = ["aac", "isomp4", "wav", "pcm", "mp3", "ogg", "vorbis", "flac"] }
