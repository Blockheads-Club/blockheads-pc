[package]
name = "bhpc-run"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "M0 runner: loads one ARM32 .so and executes its entry point in the JIT."

[lib]
name = "bhpc_run"
path = "src/lib.rs"

[[bin]]
name = "bhpc-run"
path = "src/main.rs"

[features]
# `bhpc-run --apk X` (no --init-only): SDL window and real GL/audio output. Needs the system libSDL2.
play = ["bhpc-app/sdl"]

[dependencies]
bhpc-app = { path = "../bhpc-app" }
bhpc-gles = { path = "../bhpc-gles" }
bhpc-audio = { path = "../bhpc-audio" }
bhpc-input = { path = "../bhpc-input" }
bhpc-mem.workspace = true
bhpc-cpu.workspace = true
bhpc-loader.workspace = true
bhpc-bionic.workspace = true
bhpc-jni.workspace = true
bhpc-vfs.workspace = true

[dev-dependencies]
bhpc-loader = { workspace = true, features = ["test-elf"] }

[target.'cfg(unix)'.dependencies]
libc.workspace = true
