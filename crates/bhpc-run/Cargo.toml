[package]
name = "bhpc-run"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "M0 runner: loads one ARM32 .so and executes its entry point in the JIT."

[lib]
name = "bhpc_run"
path = "src/lib.rs"

[[bin]]
name = "bhpc-run"
path = "src/main.rs"

[features]
# `bhpc-run --apk X` (no --init-only): SDL window and real GL/audio output. Needs the system libSDL2.
play = ["bhpc-app/sdl"]
# Java and Kotlin client mods (`--mods-jvm`; the user's JRE, loaded at run time). Needs a JDK to build.
jvm = ["bhpc-mods/jvm"]

[dependencies]
bhpc-app = { path = "../bhpc-app" }
bhpc-gles = { path = "../bhpc-gles" }
bhpc-audio = { path = "../bhpc-audio" }
bhpc-input = { path = "../bhpc-input" }
bhpc-launcher = { path = "../bhpc-launcher" }
bhpc-mods = { path = "../bhpc-mods" }
bhmod-content.workspace = true
bhmod-proto.workspace = true
bhpc-mem.workspace = true
bhpc-cpu.workspace = true
bhpc-loader.workspace = true
bhpc-bionic.workspace = true
bhpc-jni.workspace = true
bhpc-vfs.workspace = true
dirs = "6"

[dev-dependencies]
bhpc-loader = { workspace = true, features = ["test-elf"] }

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Networking_WinSock",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_System_IO",
] }
