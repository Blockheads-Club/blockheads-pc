# SPDX-License-Identifier: GPL-3.0-only
# Builds and tests the host-facing crates (bhpc-mem, bhpc-cpu) on Windows and macOS.
# Linux is covered by the main CI. These jobs have never run before this file was added: treat the
# first failures as expected and fix forward (see crates/bhpc-cpu/README.md, "Unverified").
name: ci-crossplat

on:
  push:
    branches: [dev, main, "m2/**"]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: windows-x64-msvc, os: windows-latest }
          - { name: macos-x86_64, os: macos-15-intel }
          - { name: macos-arm64, os: macos-14 }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Boost (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install boost cmake
          echo "BHPC_BOOST_ROOT=$(brew --prefix boost)" >> "$GITHUB_ENV"
      - name: Boost (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          # Header-only Boost (dynarmic uses variant and icl): unpack boost/ into <root>/include, the layout
          # bhpc-cpu's build passes to CMake (BOOST_ROOT + Boost_INCLUDE_DIR=<root>/include).
          root="$(cygpath -m "$RUNNER_TEMP")/boost"
          mkdir -p "$root/include"
          curl -fsSL https://archives.boost.io/release/1.86.0/source/boost_1_86_0.tar.gz \
            | tar -xz -C "$root/include" --strip-components=1 boost_1_86_0/boost
          test -f "$root/include/boost/variant.hpp"
          echo "BHPC_BOOST_ROOT=$root" >> "$GITHUB_ENV"
      - name: Build and test
        run: cargo test -p bhpc-mem -p bhpc-cpu --locked
      - name: Clippy
        run: cargo clippy -p bhpc-mem -p bhpc-cpu --all-targets --locked -- -D warnings
