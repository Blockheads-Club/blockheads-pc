# SPDX-License-Identifier: GPL-3.0-only
# Builds the "Blockheads PC" launcher installers (Tauri 2) for every shipped target; the game runner `bhpc-run` goes
# in as a sidecar (scripts/build-sidecar.sh), then `tauri build` makes
#   Linux x86_64 + arm64: AppImage, deb, rpm   Windows x86_64 + arm64: NSIS, MSI   macOS x86_64 + arm64: dmg
# Bundles hold the launcher, the sidecar and icons only; scripts/check-bundle.sh checks every bundle for the sidecar
# and for game files that must never be in it.
#
# Run by hand with `release_tag` set (a draft or pre-release), the bundles also replace that release's assets.
name: launcher-bundles

on:
  push:
    branches: [dev, main, "port/**"]
    paths: ["app/**", "crates/**", "Cargo.lock", "scripts/build-sidecar.sh", "scripts/ensure-sidecar.mjs", "scripts/check-bundle.sh", ".github/workflows/launcher-bundles.yml"]
  pull_request:
    paths: ["app/**", "scripts/build-sidecar.sh", "scripts/check-bundle.sh", ".github/workflows/launcher-bundles.yml"]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Upload the bundles to this (draft or pre-)release, replacing its assets"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: launcher-bundles-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # linuxdeploy and the AppImage runtime are AppImages themselves; runners have no FUSE.
  APPIMAGE_EXTRACT_AND_RUN: "1"

jobs:
  bundle:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x86_64, os: ubuntu-22.04, target: x86_64-unknown-linux-gnu }
          - { name: linux-arm64, os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu }
          - { name: windows-x86_64, os: windows-latest, target: x86_64-pc-windows-msvc }
          - { name: windows-arm64, os: windows-11-arm, target: aarch64-pc-windows-msvc }
          - { name: macos-x86_64, os: macos-15-intel, target: x86_64-apple-darwin }
          - { name: macos-arm64, os: macos-14, target: aarch64-apple-darwin }
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            app/src-tauri -> target
          key: ${{ matrix.target }}
      - uses: oven-sh/setup-bun@v2

      # WebKitGTK and friends for Tauri, the build tools for rpm, and what dynarmic and a static SDL2 need.
      - name: Install build dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libssl-dev patchelf rpm file xdg-utils \
            cmake g++ libboost-dev \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev libxss-dev libxkbcommon-dev libwayland-dev \
            libasound2-dev libpulse-dev libdrm-dev libgbm-dev libgl1-mesa-dev libegl1-mesa-dev libdbus-1-dev
      - name: Install build dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install cmake boost
          echo "BHPC_BOOST_ROOT=$(brew --prefix boost)" >> "$GITHUB_ENV"
      - name: Boost (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          # Header-only Boost (dynarmic uses variant and icl): unpack boost/ into <root>/include, the layout
          # bhpc-cpu's build passes to CMake (BOOST_ROOT + Boost_INCLUDE_DIR=<root>/include).
          root="$(cygpath -m "$RUNNER_TEMP")/boost"
          mkdir -p "$root/include"
          curl -fsSL https://archives.boost.io/release/1.86.0/source/boost_1_86_0.tar.gz \
            | tar -xz -C "$root/include" --strip-components=1 boost_1_86_0/boost
          test -f "$root/include/boost/variant.hpp"
          echo "BHPC_BOOST_ROOT=$root" >> "$GITHUB_ENV"

      - name: Interface tests
        working-directory: app
        run: |
          bun install --frozen-lockfile
          bun run check
          bun run test

      - name: Game runner sidecar
        shell: bash
        run: scripts/build-sidecar.sh ${{ matrix.target }}

      - name: Bundle
        working-directory: app
        # The sidecar above is built for this target; the build hook would build the host's.
        env:
          BHPC_SKIP_SIDECAR: "1"
        run: bun run tauri build --target ${{ matrix.target }}

      - name: Sidecar inside, no game files
        shell: bash
        run: scripts/check-bundle.sh app/src-tauri/target/${{ matrix.target }}/release/bundle

      - uses: actions/upload-artifact@v4
        with:
          name: blockheads-pc-${{ matrix.name }}
          if-no-files-found: error
          path: |
            app/src-tauri/target/${{ matrix.target }}/release/bundle/appimage/*.AppImage
            app/src-tauri/target/${{ matrix.target }}/release/bundle/deb/*.deb
            app/src-tauri/target/${{ matrix.target }}/release/bundle/rpm/*.rpm
            app/src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
            app/src-tauri/target/${{ matrix.target }}/release/bundle/msi/*.msi
            app/src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg

  release:
    name: release assets
    needs: bundle
    if: github.event_name == 'workflow_dispatch' && inputs.release_tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: bundles
          pattern: blockheads-pc-*
          merge-multiple: true
      - name: Replace the release's assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          ls -l bundles
          gh release view "$TAG" -R "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' |
            while IFS= read -r a; do gh release delete-asset "$TAG" "$a" -R "$GITHUB_REPOSITORY" --yes; done
          gh release upload "$TAG" bundles/* -R "$GITHUB_REPOSITORY" --clobber
