# SPDX-License-Identifier: GPL-3.0-or-later
# Builds the "Blockheads PC" launcher installers (Tauri 2) for every shipped target; the game runner `bhpc-run` goes
# in as a sidecar (scripts/build-sidecar.sh), then `tauri build` makes
#   Linux x86_64 + arm64: AppImage, deb, rpm   Windows x86_64 + arm64: NSIS, MSI   macOS x86_64 + arm64: dmg
# Bundles hold the launcher, the sidecar and icons only; scripts/check-bundle.sh checks every bundle for the sidecar
# and for game files that must never be in it.
#
# Run with `release_tag` set (a draft or pre-release), it builds that tag and the bundles replace the release's assets;
# with `publish` too it then publishes the release and rebuilds the website. auto-release.yml dispatches it that way.
name: launcher-bundles

on:
  push:
    branches: [dev, main]
    paths: ["app/**", "crates/**", "Cargo.lock", "scripts/build-sidecar.sh", "scripts/ensure-sidecar.mjs", "scripts/check-bundle.sh", ".github/workflows/launcher-bundles.yml"]
  pull_request:
    paths: ["app/**", "scripts/build-sidecar.sh", "scripts/check-bundle.sh", ".github/workflows/launcher-bundles.yml"]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Upload the bundles to this (draft or pre-)release, replacing its assets"
        required: false
        default: ""
      publish:
        description: "Publish the release once its assets are replaced (and rebuild the website)"
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  # A release build has its own group, so a later push to dev does not cancel it.
  group: launcher-bundles-${{ inputs.release_tag || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # linuxdeploy and the AppImage runtime are AppImages themselves; runners have no FUSE.
  APPIMAGE_EXTRACT_AND_RUN: "1"

jobs:
  bundle:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x86_64, os: ubuntu-22.04, target: x86_64-unknown-linux-gnu }
          - { name: linux-arm64, os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu }
          - { name: windows-x86_64, os: windows-latest, target: x86_64-pc-windows-msvc }
          - { name: windows-arm64, os: windows-11-arm, target: aarch64-pc-windows-msvc }
          - { name: macos-x86_64, os: macos-15-intel, target: x86_64-apple-darwin }
          - { name: macos-arm64, os: macos-15, target: aarch64-apple-darwin }
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            app/src-tauri -> target
          key: ${{ matrix.target }}
      - uses: oven-sh/setup-bun@v2

      # WebKitGTK and friends for Tauri, the build tools for rpm, and what dynarmic and a static SDL2 need.
      - name: Install build dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libssl-dev patchelf rpm file xdg-utils \
            cmake g++ libboost-dev \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev libxss-dev libxkbcommon-dev libwayland-dev \
            libasound2-dev libpulse-dev libdrm-dev libgbm-dev libgl1-mesa-dev libegl1-mesa-dev libdbus-1-dev
      - name: Install build dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install cmake boost
          echo "BHPC_BOOST_ROOT=$(brew --prefix boost)" >> "$GITHUB_ENV"
      - name: Boost (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          # Header-only Boost (dynarmic uses variant and icl): unpack boost/ into <root>/include, the layout
          # bhpc-cpu's build passes to CMake (BOOST_ROOT + Boost_INCLUDE_DIR=<root>/include).
          root="$(cygpath -m "$RUNNER_TEMP")/boost"
          mkdir -p "$root/include"
          curl -fsSL https://archives.boost.io/release/1.86.0/source/boost_1_86_0.tar.gz \
            | tar -xz -C "$root/include" --strip-components=1 boost_1_86_0/boost
          test -f "$root/include/boost/variant.hpp"
          echo "BHPC_BOOST_ROOT=$root" >> "$GITHUB_ENV"

      - name: Interface tests
        working-directory: app
        run: |
          bun install --frozen-lockfile
          bun run check
          bun run test

      - name: Game runner sidecar
        shell: bash
        run: scripts/build-sidecar.sh ${{ matrix.target }}

      - name: Bundle
        working-directory: app
        # The sidecar above is built for this target; the build hook would build the host's.
        env:
          BHPC_SKIP_SIDECAR: "1"
          # In-place updates: with the updater key (secrets TAURI_SIGNING_PRIVATE_KEY[_PASSWORD]) the build also signs
          # the updater artifacts (AppImage, NSIS installer, macOS .app.tar.gz) and writes a .sig next to each.
          # Without the key (forks, pull requests) it builds as before and the release job skips latest.json.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        shell: bash
        run: |
          updater=false
          [ -n "$TAURI_SIGNING_PRIVATE_KEY" ] && updater=true
          # hdiutil on the GitHub macOS runners sometimes fails to create the .dmg ("Resource busy"); retry on macOS.
          tries=1
          [ "$RUNNER_OS" = macOS ] && tries=3
          for i in $(seq "$tries"); do
            bun run tauri build --target ${{ matrix.target }} --config "{\"bundle\":{\"createUpdaterArtifacts\":$updater}}" && break
            [ "$i" = "$tries" ] && exit 1
            echo "::warning::bundle attempt $i failed, retrying"; sleep 15
          done

      - name: Sidecar inside, no game files
        shell: bash
        run: scripts/check-bundle.sh app/src-tauri/target/${{ matrix.target }}/release/bundle

      # Ad-hoc signed (tauri.macos.conf.json): the sidecar must carry the JIT entitlements, and its JIT must run from
      # inside the signed bundle (MAP_JIT under the hardened runtime).
      - name: Signed app runs the JIT
        if: runner.os == 'macOS'
        run: |
          app="$(ls -d app/src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.app | head -1)"
          codesign --verify --deep --strict --verbose=2 "$app"
          codesign -d --entitlements - --xml "$app/Contents/MacOS/bhpc-run" | grep -q com.apple.security.cs.allow-jit
          codesign -dv "$app/Contents/MacOS/bhpc-run" 2>&1 | tee /dev/stderr | grep -q "Signature=adhoc"
          "$app/Contents/MacOS/bhpc-run" --bench-thunk 100000
      - name: Sidecar runs the JIT
        if: runner.os != 'macOS'
        shell: bash
        run: |
          ext=""; case "${{ matrix.target }}" in *windows*) ext=".exe" ;; esac
          "app/src-tauri/binaries/bhpc-run-${{ matrix.target }}$ext" --bench-thunk 100000

      # macOS updater tarballs are all named "<product>.app.tar.gz": give each its version and arch (the feed picks
      # files by name).
      - name: Name the macOS updater files
        if: runner.os == 'macOS'
        shell: bash
        run: |
          arch="${{ matrix.target }}"; arch="${arch%%-*}"; [ "$arch" = x86_64 ] && arch=x64
          version="$(sed -n 's/^  "version": "\(.*\)",/\1/p' app/src-tauri/tauri.conf.json)"
          cd app/src-tauri/target/${{ matrix.target }}/release/bundle/macos
          for f in *.app.tar.gz *.app.tar.gz.sig; do
            [ -e "$f" ] || continue
            case "$f" in *.sig) ext=".app.tar.gz.sig" ;; *) ext=".app.tar.gz" ;; esac
            mv -v -- "$f" "Blockheads PC_${version}_${arch}${ext}"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: blockheads-pc-${{ matrix.name }}
          if-no-files-found: error
          path: |
            app/src-tauri/target/${{ matrix.target }}/release/bundle/appimage/*.AppImage
            app/src-tauri/target/${{ matrix.target }}/release/bundle/deb/*.deb
            app/src-tauri/target/${{ matrix.target }}/release/bundle/rpm/*.rpm
            app/src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
            app/src-tauri/target/${{ matrix.target }}/release/bundle/msi/*.msi
            app/src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            app/src-tauri/target/${{ matrix.target }}/release/bundle/appimage/*.AppImage.sig
            app/src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe.sig
            app/src-tauri/target/${{ matrix.target }}/release/bundle/msi/*.msi.sig
            app/src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.app.tar.gz
            app/src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.app.tar.gz.sig

  release:
    name: release assets
    needs: bundle
    if: github.event_name == 'workflow_dispatch' && inputs.release_tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      # Checkout first: it cleans the workspace, which would delete artifacts downloaded before it.
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: bundles
          pattern: blockheads-pc-*
          merge-multiple: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Write latest.json (the launcher's update feed)
        env:
          TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          # GitHub turns spaces in asset names into dots: rename first so the feed matches the stored names.
          find bundles -type f -name '* *' -print0 | while IFS= read -r -d '' f; do mv -v -- "$f" "$(dirname "$f")/$(basename "$f" | tr ' ' '.')"; done
          if [ -n "$(find bundles -name '*.sig' -print -quit)" ]; then
            mkdir feed && find bundles -type f -exec cp {} feed/ \;
            node scripts/updater-manifest.mjs feed "${TAG#v}" "$TAG"
            cp feed/latest.json bundles/latest.json
          else
            echo "::notice::no updater signatures (TAURI_SIGNING_PRIVATE_KEY unset): latest.json skipped"
          fi
      - name: Replace the release's assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          # The artifacts keep their bundle/<format>/ folders: upload the files inside.
          find bundles -type f | sort
          gh release view "$TAG" -R "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' |
            while IFS= read -r a; do gh release delete-asset "$TAG" "$a" -R "$GITHUB_REPOSITORY" --yes; done
          find bundles -type f -print0 | xargs -0 gh release upload "$TAG" -R "$GITHUB_REPOSITORY" --clobber
      # A release published with GITHUB_TOKEN starts no `release: published` workflow, so the website rebuild is
      # dispatched here.
      - name: Publish the release and rebuild the website
        if: inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release_tag }}
        run: |
          gh release edit "$TAG" --draft=false -R "$GITHUB_REPOSITORY"
          gh workflow run website-rebuild.yml -R "$GITHUB_REPOSITORY" --ref dev
