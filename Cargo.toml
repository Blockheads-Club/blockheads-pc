[workspace]
resolver = "2"
members = [
    "crates/bhpc-mem",
    "crates/bhpc-cpu",
    "crates/bhpc-loader",
    "crates/bhpc-run",
    "crates/bhpc-vfs",
    # Stubs for later milestones (see docs/feasibility/PLAN.md).
    "crates/bhpc-bionic",
    "crates/bhpc-jni",
    "crates/bhpc-gles",
    "crates/bhpc-audio",
    "crates/bhpc-input",
    "crates/bhpc-app",
    "crates/bhpc-launcher",
    "crates/bhpc-mods",
]

[workspace.package]
version = "0.4.0"
edition = "2021"
rust-version = "1.86"
license = "GPL-3.0-or-later"
repository = "https://github.com/Blockheads-Club/blockheads-pc"

[workspace.dependencies]
libc = "0.2"
cmake = "0.1"
bhpc-mem = { path = "crates/bhpc-mem" }
bhpc-cpu = { path = "crates/bhpc-cpu" }
bhpc-loader = { path = "crates/bhpc-loader" }
bhpc-bionic = { path = "crates/bhpc-bionic" }
bhpc-jni = { path = "crates/bhpc-jni" }
bhpc-vfs = { path = "crates/bhpc-vfs" }
# The shared mod host (Luau + WASM), the 0xBC codec and the package rules, from Blockheads-Club/mod-sdk at a pinned
# commit (the same crates the Blockheads Server uses).
bhmod-core = { git = "https://github.com/Blockheads-Club/mod-sdk", rev = "506077d45f12e4aadd111204a78eab2f97244369" }
bhmod-wasm = { git = "https://github.com/Blockheads-Club/mod-sdk", rev = "506077d45f12e4aadd111204a78eab2f97244369" }
bhmod-manifest = { git = "https://github.com/Blockheads-Club/mod-sdk", rev = "506077d45f12e4aadd111204a78eab2f97244369" }
bhmod-proto = { git = "https://github.com/Blockheads-Club/mod-sdk", rev = "506077d45f12e4aadd111204a78eab2f97244369" }
bhmod-client = { git = "https://github.com/Blockheads-Club/mod-sdk", rev = "506077d45f12e4aadd111204a78eab2f97244369" }
bhmod-content = { git = "https://github.com/Blockheads-Club/mod-sdk", rev = "506077d45f12e4aadd111204a78eab2f97244369" }
bhmod-native = { git = "https://github.com/Blockheads-Club/mod-sdk", rev = "506077d45f12e4aadd111204a78eab2f97244369" }
bhmod-voice = { git = "https://github.com/Blockheads-Club/mod-sdk", rev = "506077d45f12e4aadd111204a78eab2f97244369" }
bhmod-opus-sys = { git = "https://github.com/Blockheads-Club/mod-sdk", rev = "506077d45f12e4aadd111204a78eab2f97244369" }

