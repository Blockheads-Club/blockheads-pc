[workspace]
resolver = "2"
members = [
    "crates/bhpc-mem",
    "crates/bhpc-cpu",
    "crates/bhpc-loader",
    "crates/bhpc-run",
    "crates/bhpc-vfs",
    # Stubs for later milestones (see docs/feasibility/PLAN.md).
    "crates/bhpc-bionic",
    "crates/bhpc-jni",
    "crates/bhpc-gles",
    "crates/bhpc-audio",
    "crates/bhpc-input",
    "crates/bhpc-app",
    "crates/bhpc-launcher",
]

[workspace.package]
version = "0.0.0"
edition = "2021"
rust-version = "1.86"
license = "GPL-3.0-only"
repository = "https://github.com/Blockheads-Club/blockheads-pc"

[workspace.dependencies]
libc = "0.2"
cmake = "0.1"
bhpc-mem = { path = "crates/bhpc-mem" }
bhpc-cpu = { path = "crates/bhpc-cpu" }
bhpc-loader = { path = "crates/bhpc-loader" }
bhpc-bionic = { path = "crates/bhpc-bionic" }
bhpc-jni = { path = "crates/bhpc-jni" }
bhpc-vfs = { path = "crates/bhpc-vfs" }

[profile.release]
debug = 1
