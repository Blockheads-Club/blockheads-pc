schema = 1
id = "arms"
version = "1.0.0"
name = { en = "Arms" }
description = { en = "Weapon skins: a golden spade and a flame pickaxe on the held item (weapon cosmetics, native hooks; the pictures are the weapon-skins example of mod-sdk)" }
authors = ["Blockheads Club"]
license = "MIT"
api = "^0.3"

[sides]
client = true

[entry.client]
runtime = "lua"
path = "client/main.luau"

[content]
cosmetics = [
  { key = "arms:golden-spade", slot = "weapon", texture = "assets/golden-spade.png", base = "iron-sword" },
  { key = "arms:flame-pickaxe", slot = "weapon", texture = "assets/flame-pickaxe.png", base = "gold-pickaxe" },
]
