[package]
name = "blockheads-pc-app"
version = "0.4.0"
description = "Blockheads PC launcher"
edition = "2021"
rust-version = "1.86"
license = "GPL-3.0-or-later"
publish = false

# Own workspace root: keeps the GUI dependencies out of the game workspace (and its CI and coverage gate).
[workspace]

[lib]
name = "blockheads_pc_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
# In-place updates, only on a click (src/updater.rs); the feed and the pinned public key are in tauri.conf.json.
tauri-plugin-updater = "2"
bhpc-launcher = { path = "../../crates/bhpc-launcher" }
bhpc-input = { path = "../../crates/bhpc-input" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Downloads of the public mod list and mod packages (HTTPS, rustls with bundled roots).
ureq = { version = "2", default-features = false, features = ["tls"] }

# Windows and macOS tray (Linux uses ksni, see src/tray.rs).
[target.'cfg(not(target_os = "linux"))'.dependencies]
tauri = { version = "2", features = ["tray-icon"] }

# The in-window game view on Windows: a child window shown through a D3D11 swap chain (src/embed_win.rs).
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
  "Win32_Graphics_Direct3D",
  "Win32_Graphics_Direct3D_Fxc",
  "Win32_Graphics_Direct3D11",
  "Win32_Graphics_Dxgi",
  "Win32_Graphics_Dxgi_Common",
] }
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Graphics_Dwm",
  "Win32_Graphics_Gdi",
  "Win32_System_DataExchange",
  "Win32_System_LibraryLoader",
  "Win32_System_Memory",
  "Win32_System_Ole",
  "Win32_System_Threading",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }

# The in-window game view on macOS: an NSView over the webview showing frames as layer contents (src/embed_mac.rs).
# Same versions as Tauri's own (wry, tao).
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["objc2-quartz-core"] }
objc2-core-foundation = "0.3"
objc2-core-graphics = "0.3"
objc2-foundation = "0.3"
objc2-quartz-core = "0.3"

# The in-window game view is a GTK widget next to the webview (Linux; see src/embed.rs). Tauri uses the same version.
[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"
# dlopen of the GL library GDK uses (src/embed_gl.rs).
libc = "0.2"
# Tray: StatusNotifierItem over D-Bus directly (left click, tooltip and title work, unlike appindicator).
ksni = { version = "0.3", default-features = false, features = ["blocking", "async-io"] }

[profile.release]
opt-level = 3
strip = true
lto = "thin"

# TEMP: the local mod-sdk voice-api worktree (replace with a git rev before pushing).
[patch."https://github.com/Blockheads-Club/mod-sdk"]
bhmod-manifest = { path = "/home/kahverengi/Projects/blockheads-club/mod-sdk-wt/voice-int/crates/bhmod-manifest" }
