[package]
name = "blockheads-pc-app"
version = "0.1.0"
description = "Blockheads PC launcher"
edition = "2021"
rust-version = "1.86"
license = "GPL-3.0-only"
publish = false

# Own workspace root: keeps the GUI dependencies out of the game workspace (and its CI and coverage gate).
[workspace]

[lib]
name = "blockheads_pc_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
bhpc-launcher = { path = "../../crates/bhpc-launcher" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
strip = true
lto = "thin"
