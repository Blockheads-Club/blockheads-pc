# Every app command, for the launcher's own windows (main, splash). The game page window gets none.
[[set]]
identifier = "app-commands"
description = "Every command of the launcher's backend."
permissions = [
  "allow-app-info",
  "allow-splash-set",
  "allow-splash-get",
  "allow-splash-retry",
  "allow-app-quit",
  "allow-tray-labels",
  "allow-main-ready",
  "allow-boot",
  "allow-save-config",
  "allow-save-prefs",
  "allow-finish-setup",
  "allow-check-apk",
  "allow-use-apk",
  "allow-normalize-binding",
  "allow-display-info",
  "allow-window-resize",
  "allow-import-saves",
  "allow-data-size",
  "allow-move-data-dir",
  "allow-open-path",
  "allow-game-start",
  "allow-game-stop",
  "allow-game-poll",
  "allow-embed-layout",
  "allow-embed-reveal",
  "allow-embed-focus",
  "allow-embed-fullscreen",
  "allow-save-log",
  "allow-update-check",
  "allow-update-install",
  "allow-update-progress",
  "allow-update-restart",
  "allow-mods-overview",
  "allow-mods-index",
  "allow-mods-plan",
  "allow-mods-inspect-file",
  "allow-mods-inspect-link",
  "allow-mods-install",
  "allow-mods-set-enabled",
  "allow-mods-set-grant",
  "allow-mods-remove",
  "allow-mods-auto-update",
  "allow-mods-servers",
  "allow-mods-clear-server",
  "allow-mods-clear-servers",
  "allow-mods-dev-inspect",
  "allow-mods-dev-reload",
  "allow-mods-dev-fingerprint",
  "allow-mods-dev-join",
]
